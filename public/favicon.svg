<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <!-- Face Scan Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#3730A3" stroke-width="6" />
  
  <!-- Subtle Grid Pattern Background -->
  <path d="M120 256 H392 M256 120 V392" stroke="#4338CA" stroke-width="2" opacity="0.25" stroke-dasharray="8 8" />

  <!-- Face Recognition Bounding Frame Corners -->
  <g stroke="url(#frameGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Top-Left -->
    <path d="M 120 184 V 128 H 184" />
    <!-- Top-Right -->
    <path d="M 328 128 H 392 V 184" />
    <!-- Bottom-Left -->
    <path d="M 120 328 V 384 H 184" />
    <!-- Bottom-Right -->
    <path d="M 328 384 H 392 V 328" />
  </g>

  <!-- Biometric Scanner Facial Nodes -->
  <circle cx="256" cy="150" r="10" fill="#38BDF8" opacity="0.9" />
  <circle cx="160" cy="256" r="8" fill="#818CF8" opacity="0.7" />
  <circle cx="352" cy="256" r="8" fill="#818CF8" opacity="0.7" />

  <!-- Main Attendance Verification Checkmark -->
  <path d="M 165 260 L 232 327 L 350 195" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#checkGlow)" />
</svg>